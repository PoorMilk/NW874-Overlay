name: Sync ImmortalWrt
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
  actions: write
env:
  UPSTREAM: padavanonly/immortalwrt-mt798x-6.6
  DTS_FILE: target/linux/mediatek/dts/mt7981b-qihoo-360t7.dts
  BRANCH: master
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "PoorMilk"
          git config user.email "PoorMilk@users.noreply.github.com"
      - name: Sync upstream source
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/${{ env.UPSTREAM }}.git
          git fetch upstream
          git reset --hard upstream/${{ env.BRANCH }}
      - name: Restore workflow and custom dts
        run: |
          git fetch origin
          git checkout origin/main -- .github/workflows/ ${{ env.DTS_FILE }}
      - name: Commit and push changes
        run: |
          git add .
          git commit -m "Sync ImmortalWrt upstream + retain custom mt7981b-qihoo-360t7.dts"
          git push --force-with-lease origin main
      - name: Prune old runs, keep latest 5
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: "Sync ImmortalWrt"
          keep_minimum_runs: 5
